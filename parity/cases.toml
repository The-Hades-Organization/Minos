# Matriz de paridade do Minos: `hades minos ...` (TS, Hades-Skill) contra o binário `minos`.
# O argv é o do binário; o lado TS ganha o subcomando `minos` por `ts_cmd`. A skill (--ts e HADES_SKILL_DIR) é a
# montada por parity/montar-skill.sh. Origem: commands/minos.ts, lib/minos-store.ts e minos-comando.test.ts:92-130.
# O registro de saídas vem das fixtures (o publish Rust chega depois); dados fictícios.

[[case]]
id = "uso.sem-subcomando"
argv = []
ts_cmd = ["{skill}/src/cli.ts", "minos"]
compare = ["stdout", "stderr", "exit"]

[[case]]
id = "uso.desconhecido"
argv = ["xyz"]
ts_cmd = ["{skill}/src/cli.ts", "minos"]
compare = ["stdout", "stderr", "exit"]

